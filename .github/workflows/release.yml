name: Verify 97 YouTube MCP tools and publish GHCR
on:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: "33 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: youtube-mcp-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build latest upstream package and minimal compatibility adapter
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          load: true
          platforms: linux/amd64
          tags: local/cloud9-youtube-mcp:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Exact live HTTP MCP contract, no OAuth accounts or external network
        run: |
          set -euo pipefail
          docker run --rm --network none -v "$PWD:/contract:ro"             --entrypoint sh local/cloud9-youtube-mcp:test -c '
              export HOME=/tmp XDG_CONFIG_HOME=/tmp/youtube-config XDG_DATA_HOME=/tmp/youtube-share NO_PROXY=127.0.0.1,localhost
              mkdir -p "$XDG_CONFIG_HOME" "$XDG_DATA_HOME"
              python /opt/youtube-mcp/server_wrapper.py >/tmp/server.log 2>&1 &
              pid=$!
              sleep 5
              python /contract/verify-mcp.py
              rc=$?
              kill "$pid" 2>/dev/null || true
              if [ "$rc" -ne 0 ]; then tail -25 /tmp/server.log; fi
              exit "$rc"
            '
      - name: Repository privacy and docs audit
        run: |
          test -s LICENSE
          test -s README.md
          test -s README.fr.md
          test -s README.zh-CN.md
          python3 scripts/privacy-check.py
  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/godsquantum/cloud9-youtube-mcp
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
