name: cloud9-youtube-mcp
services:
  youtube-mcp:
    image: ghcr.io/godsquantum/cloud9-youtube-mcp:latest
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      XDG_CONFIG_HOME: /data/config
      XDG_DATA_HOME: /data/share
      HOME: /data/home
    volumes:
    - ./data:/data
    ports:
    - 127.0.0.1:8765:8765
    security_opt:
    - no-new-privileges:true
    healthcheck:
      test:
      - CMD-SHELL
      - python -c 'import socket; socket.create_connection(("127.0.0.1",8765),2)'
      interval: 30s
      timeout: 5s
      retries: 3
